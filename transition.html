<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exemplos de Transições CSS</title>
    <link rel="stylesheet" href="css/estilo.css">
</head>
<body>
    <h1>Exemplos de Transições CSS</h1>

    <div class="container">
        <!-- Exemplo 1: transição básica -->
        <div class="caixa caixa1">
            <p>Transição de cor e tamanho</p>
        </div>

        <!-- Exemplo 2: duração diferente -->
        <div class="caixa caixa2">
            <p>Duração: 2 segundos</p>
        </div>

        <!-- Exemplo 3: função de temporização -->
        <div class="caixa caixa3">
            <p>Função: ease-in-out</p>
        </div>

        <!-- Exemplo 4: com atraso -->
        <div class="caixa caixa4">
            <p>Com atraso de 0,5s</p>
        </div>

        <!-- Exemplo 5: transformação + transição -->
        <div class="caixa caixa5">
            <p>Escala e rotação</p>
        </div>
    </div>

    
</body>
</html>
